<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Analyzer</title>
    <meta
      name="description"
      content="Cost basis, market value, dividends and Swiss tax reporting for an Interactive Brokers portfolio."
    />
    <!-- Inline SVG data URI rather than a file: a few hundred bytes, it cannot 404 after
         a deploy. The same drawing as the header's BrandMark, which reads on both themes. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 21.5 L12.5 15.5 L17 19 L25 10.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='10.5' r='2.2' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!-- Tints the browser chrome on mobile to match the app bar it sits above (the card
         surface: white, and the dark card) rather than flashing the opposite one on load. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121621" media="(prefers-color-scheme: dark)" />
    <!-- It serves one account's financial data and is linked from nowhere. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
