# Runs both test suites on every push and pull request.
#
# Until 2026-08-19 nothing did. `ops/auto-deploy.sh` deploys whatever lands on
# origin/main within ten minutes and gated only on `/health`, which issues no database
# query and touches no router — so a commit that 500s every /api/portfolio/* route
# deployed, passed the gate, and was logged SUCCESS. 84 test files existed and none of
# them ran between a commit and production.
#
# This is only half of that fix. The other half is in ops/auto-deploy.sh, which asks the
# GitHub check-runs API what these jobs concluded and refuses to deploy a red commit.
# Keep the two in step: renaming a job here is fine (the gate reads conclusions, not
# names), but removing one silently widens what can reach production.
#
# No secrets, deliberately. Every test in both suites is offline — CLAUDE.md's first
# rule is that Yahoo is never called casually, `tests/test_api_smoke.py` installs a
# raiser for yfinance, and nothing here has an IBKR token. A CI run must never be able
# to spend the Flex generation budget or this account's Yahoo quota.

name: CI

on:
  push:
  pull_request:

# A second push supersedes the first; there is no value in finishing a run for a commit
# that is already behind, and the deploy gate only ever asks about the newest sha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. Nothing here writes back: the deploy gate in ops/auto-deploy.sh reads
# check-run conclusions unauthenticated, so no job needs more than the checkout.
permissions:
  contents: read

# Every `uses:` is a full commit sha with its tag as a comment. A tag is mutable, so a
# moved one would run unreviewed code inside the job that decides what deploys.

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.11 to match backend/Dockerfile's python:3.11-slim. Local development runs
      # 3.12, so this is the version that actually ships.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      # The repo is public; a SQLite file under a name .gitignore misses is account data
      # (issue #36). Content check, stdlib only, so it runs first and fails fast. It runs
      # after the push, so it reports a leak rather than preventing one: the prevention is
      # the same script as a pre-commit hook (docs/local-development.md).
      - name: Refuse a tracked SQLite database
        run: python ../ops/check_no_sqlite.py

      # The image's own lock, byte for byte, plus the test tooling's, in one hash-checked
      # pass: pip refuses if the two disagree on a shared package, so the tests run against
      # exactly the versions that ship. requirements.txt / requirements-dev.txt are only
      # the inputs the locks are compiled from (docs/tech-stack.md, "Bumping a dependency").
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock

      # Correctness rules only (backend/ruff.toml). Ruff is in neither lock (the image
      # installs requirements.lock), so it is pinned here; 0.16.0 is what the tree was
      # checked clean with.
      - name: Ruff
        run: |
          pip install ruff==0.16.0
          ruff check .

      # `Settings` declares ibkr_token and ibkr_query_id with no default, on purpose —
      # a production container must not boot without a token. The cost is that merely
      # *importing* `app.config` fails without `backend/.env`, which is gitignored, so a
      # fresh clone cannot run the suite at all. CI found that on its first run.
      #
      # Placeholders rather than secrets, and that is the point: every test in this
      # suite is offline (`tests/test_api_smoke.py` installs a raiser for yfinance, and
      # nothing here reaches Flex), so a value that could not authenticate anywhere is
      # exactly the right value. A real token in CI would be a credential on a public
      # repo's runners with nothing to spend it on but this account's lockout budget.
      - name: Provide placeholder credentials (all tests are offline)
        run: |
          echo "IBKR_TOKEN=ci-placeholder-not-a-token" > .env
          echo "IBKR_QUERY_ID=0" >> .env

      # `python -m pytest`, not bare `pytest`: there is no pytest.ini or pyproject, so
      # rootdir inference puts tests/ on sys.path but not backend/, and every
      # `from app...` import fails. The documented local command has the same shape for
      # the same reason.
      #
      # `-n auto` runs one worker per core. `--dist worksteal`, not the default `load`:
      # `load` hands each worker a contiguous run of tests up front, so the bash-driven
      # deploy tests (seconds each, all in two files) pile onto one worker and set the wall
      # time. Measured locally on 16 cores: 55 s worksteal, 93 s load, 5:35 serial.
      # No `-m "not deploy_scripts"` here, unlike the local command: CI is where those run,
      # and this job's verdict is the deploy gate.
      - run: python -m pytest tests/ -q -n auto --dist worksteal

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22 to match what deploy.sh installs on the VPS (and frontend/package.json's
      # `engines`). Move all three together.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      # `npm run build` is `tsc -b && vite build`, so this is the type check too.
      - run: npm run build

  # The image deploy.sh builds on the VPS. The backend job installs the same lock on the
  # runner, which says nothing about the Dockerfile itself — a broken COPY or an
  # install that fails only on python:3.11-slim used to surface first as a failed deploy
  # (rolled back, but only after a build there). Built locally, never pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend/Dockerfile
        run: docker build --pull -t portfolio-backend:ci backend

      # Importing the app inside the image catches a module the image lacks. Placeholder
      # credentials, as in the backend job; importing opens no database and starts nothing.
      - name: Import the app inside the image
        run: >-
          docker run --rm
          -e IBKR_TOKEN=ci-placeholder-not-a-token -e IBKR_QUERY_ID=0
          portfolio-backend:ci python -c "import app.main"

  # e2e/ is deliberately absent: it needs a running stack and, for two of its scripts, a
  # production database snapshot. Its docblock explains why it is not a frontend
  # devDependency either.
