services:
  portfolio-backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The database's DIRECTORY, not the file. Until 2026-10-04 this read
      # `./portfolio.db:/app/portfolio.db`, and a file bind mount carries only the file:
      # SQLite's -wal and -shm sidecars were created beside it inside the container's
      # writable layer, so every `docker compose down` destroyed every commit since the
      # last auto-checkpoint (docs/deployment.md has the measurement). Mounted as a
      # directory they land on the host with the database. deploy.sh moves an existing
      # backend/portfolio.db here once (ops/db-layout.sh) and leaves a symlink behind.
      - ./data:/app/data
      # APScheduler's job store. A separate file from portfolio.db because the store is
      # synchronous SQLAlchemy while the app is aiosqlite in WAL mode, and pointing both
      # at one file invites lock contention on the database holding the actual portfolio.
      # It has to outlive the container: persisting jobs is pointless if the rebuild that
      # loses a sync slot in the first place also discards them.
      #
      # **A directory, not the .db file itself.** Docker creates a missing bind-mount
      # source *as a directory*, which is unrecoverable for a file mount: from
      # 2026-07-30 to 08-01 this read `./scheduler_jobs.db:/app/scheduler_jobs.db`,
      # nothing ever created that file, so both sides became an empty directory and
      # sqlite answered `unable to open database file` on every boot. The store fell
      # back to memory — and because the fallback re-registers every job,
      # `/api/scheduler/status` looked identical to a working store, so the feature was
      # inert for two days while appearing healthy. Mounting the parent directory makes
      # Docker's auto-create the right shape and lets sqlite create the file itself.
      - ./scheduler-data:/app/scheduler-data
    env_file:
      - .env
    environment:
      # Set HERE rather than left to `.env`, because `environment:` overrides `env_file:`
      # and the host's .env predates the move — it may still name ./portfolio.db, and a
      # container reading that would never see the file in /app/data. Absolute (four
      # slashes) so the working directory cannot change which file it is.
      DATABASE_URL: sqlite+aiosqlite:////app/data/portfolio.db
      # app/db_guard.py refuses to start on a missing or empty database unless this is 1.
      # Only a genuinely fresh install sets it: `ALLOW_NEW_DATABASE=1 ./deploy.sh`.
      ALLOW_NEW_DATABASE: ${ALLOW_NEW_DATABASE:-0}
      # Reported by /health and shown in the app footer. deploy.sh exports it from the
      # deployed sha; "unknown" locally, where there is nothing to identify.
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    # Bounded because the app's own INFO logging was switched on (2026-08-04) — until
    # then `settings.log_level` configured nothing and only WARNING+ was ever emitted,
    # so volume was negligible. Seven market-data passes a day over 40 securities is a
    # few thousand lines, which is fine to keep and not fine to keep *forever*: the
    # default json-file driver has no size limit at all, and this is a small VPS whose
    # disk also holds the database and its backups.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # Lets `docker compose ps` tell "running" from "actually serving": the container
      # is up while alembic is still migrating on start.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  portfolio-frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
